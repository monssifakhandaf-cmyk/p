name: Make main videos (landscape, link in the description)

on:
  workflow_dispatch:
    inputs:
      game:
        description: "Which game"
        type: choice
        default: both
        options: [both, antsmash, neontower]
      count:
        description: "Videos per game"
        default: "2"

permissions:
  contents: write

concurrency:
  group: make-short
  cancel-in-progress: false

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install ffmpeg + fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-color-emoji fonts-dejavu-core
      - name: Install dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Make main videos, send to Telegram, upload to YouTube
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
        run: node factory.js main --game "${{ inputs.game }}" --count "${{ inputs.count }}" --send --upload
      - name: Save history
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add data/history.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "chore: update history" && git push)
      - name: Keep a copy (14 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-${{ github.run_number }}
          path: |
            out/*.mp4
            out/*.jpg
          retention-days: 14
          if-no-files-found: ignore
