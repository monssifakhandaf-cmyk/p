name: Make Short and send to Telegram

on:
  schedule:
    - cron: "0 12 * * *"      # runs daily at 12:00 UTC; the job itself only continues every 2nd day
  workflow_dispatch:           # manual run button (always runs)

permissions:
  contents: write              # needed to save data/history.json (anti-repetition memory)

concurrency:
  group: make-short
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Every-2-days gate
        id: gate
        run: |
          days=$(( $(date -u +%s) / 86400 ))
          if [ "${{ github.event_name }}" = "schedule" ] && [ $((days % 2)) -ne 0 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Skipping today (runs every 2 days)."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 20

      - name: Install ffmpeg + emoji font
        if: steps.gate.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-color-emoji

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Make the video and send it to Telegram
        if: steps.gate.outputs.run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node factory.js make --count 1 --send

      - name: Save history (so the next video is different)
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || (git commit -m "chore: update history" && git push)

      - name: Keep a copy of the video (14 days)
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: out/*.mp4
          retention-days: 14
          if-no-files-found: ignore
