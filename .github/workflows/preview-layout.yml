name: Preview layout (sends screenshots to Telegram)

on:
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install emoji font
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-color-emoji
      - name: Install dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Render preview and send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/preview-layout.js
